[project]
name = "pycyclops"
version = "0.3.0"
description = "Framework for healthcare ML implementation"
authors = [{ name = "Vector AI Engineering", email = "cyclops@vectorinstitute.ai" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas[performance]>=2.1,<3",
    "numpy>=1.24,<2",
    # <1.8: cyclops.evaluate imports sklearn.metrics._ranking._binary_clf_curve,
    # which was removed in scikit-learn 1.8
    "scikit-learn>=1.3,<1.8",
    "scipy>=1.11,<2",
    "matplotlib>=3.8.3,<4",
    "datasets>=2.15,<3",
    "psutil>=5.9.4,<6",
    "pyarrow>=17.0.0,<24",
    "pydantic>=2.7.0,<3",
    "Jinja2>=3.1.3,<4",
    "spdx-tools>=0.8.1,<0.9",
    "pybtex>=0.24.0,<0.25",
    # <81: pybtex imports pkg_resources at runtime, which setuptools 81+
    # deprecates and later versions remove
    "setuptools>=78.1.1,<81",
    "kaleido==0.2.1",
    "scour>=0.38.2,<0.39",
    "plotly>=5.7.0,<7",
    "pillow>=10.0.0,<13",
    "array-api-compat==1.6",
    "hydra-core>=1.2.0,<2",
]

[project.urls]
repository = "https://github.com/VectorInstitute/cyclops"
documentation = "https://vectorinstitute.github.io/cyclops/"

[project.optional-dependencies]
torch = ["torch>=2.0,<3"]
torchvision = ["torchvision>=0.15"]
torchxrayvision = ["torch>=2.0,<3", "torchxrayvision>=1.2.0,<2"]
monai = ["torch>=2.0,<3", "monai[itk]>=1.3.0,<2"]
xgboost = ["xgboost>=1.5.2,<2"]
alibi = ["llvmlite>=0.40.0,<0.41", "alibi[shap]>=0.9.4,<0.10"]
alibi-detect = ["torch>=2.0,<3", "llvmlite>=0.40.0,<0.41", "alibi-detect[torch]>=0.12.0,<0.13"]
all = [
    "torch>=2.0,<3",
    "torchvision>=0.15",
    "torchxrayvision>=1.2.0,<2",
    "llvmlite>=0.40.0,<0.41",
    "monai[itk]>=1.3.0,<2",
    "xgboost>=1.5.2,<2",
    "alibi[shap]>=0.9.4,<0.10",
    "alibi-detect[torch]>=0.12.0,<0.13",
]

[dependency-groups]
test = [
    "pytest>=9.0.3,<10",
    "pre-commit>=4.0.0,<5",
    "pytest-cov>=6.0.0,<8",
    "codecov>=2.1.13,<3",
    "nbstripout>=0.6.1,<0.7",
    "mypy>=1.7.0,<2",
    "ruff>=0.4.0,<1",
    "nbqa[toolchain]>=1.7.0,<2",
    "pip-audit>=2.7.1,<3",
    "cycquery>=0.1.2", # used for integration test
    # <1.3: metric tests compare against torchmetrics reference outputs, and
    # zero-division behavior changed in later torchmetrics releases
    "torchmetrics>=1.2.0,<1.3",
    "pytest-mpi>=0.6",
    "pytest-xdist[psutil]>=3.5.0,<4",
]
docs = [
    "numpydoc>=1.2,<2",
    "sphinx>=7.2.5,<8",
    "sphinxcontrib-apidoc>=0.4.0,<0.5",
    "sphinx-autodoc-typehints>=1.24.0,<2",
    "myst-parser>=2.0.0,<3",
    "sphinx-design>=0.5.0,<0.6",
    "sphinx-copybutton>=0.5.0,<0.6",
    "sphinx-autoapi>=2.0.0,<3",
    "nbsphinx>=0.9.3,<0.10",
    "ipython>=8.8.0,<9",
    "ipykernel>=6.23.0,<7",
    "kaggle>=1.5.13,<2",
    "imbalanced-learn>=0.12.0,<0.13",
    "furo>=2024.01.29",
]
dev = [
    "cycquery>=0.1.0",
    "seaborn>=0.11.2,<0.12",
    "jupyter>=1.0.0,<2",
    "jupyterlab>=4.6.2,<5",
    "ipympl>=0.9.3,<0.11",
    "ipywidgets>=8.0.6,<9",
    # <1.3: metric tests compare against torchmetrics reference outputs, and
    # zero-division behavior changed in later torchmetrics releases
    "torchmetrics>=1.2.0,<1.3",
    "cupy>=13.3.0,<14",
    "mpi4py",
    "imbalanced-learn>=0.12.0,<0.13",
    "pyperf>=2.6.3,<3",
]
deploy-models = [
    "aiohttp>=3.9.2,<4",
    "bentoml[triton]==1.4.8",
    "torchxrayvision>=1.2.1,<2",
    "kaggle>=1.5.13,<2",
    "onnx>=1.15.0,<2",
    "skl2onnx>=1.16.0,<2",
]
deploy-report = [
    "fastapi>=0.111.0,<1",
    "uvicorn>=0.30.1,<1",
]

# No dependency group is installed by default (like poetry's opt-in groups);
# the dev group in particular contains cupy, which needs CUDA to build
[tool.uv]
default-groups = []

[tool.uv.sources]
mpi4py = { git = "https://github.com/mpi4py/mpi4py" }

[tool.hatch.build.targets.wheel]
packages = ["cyclops"]

[tool.mypy]
plugins = ["numpy.typing.mypy_plugin"]
ignore_missing_imports = true
install_types = true
pretty = true
namespace_packages = true
explicit_package_bases = true
non_interactive = true
warn_unused_configs = true
allow_any_generics = false
allow_subclassing_any = false
allow_untyped_calls = false
allow_untyped_defs = false
allow_incomplete_defs = false
check_untyped_defs = true
allow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle
    "N", # pep8-naming
    "ERA", # eradicate
    "PL", # pylint
]
fixable = ["A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE", "D", "E", "F", "I", "W", "N", "ERA", "PL"]
ignore = [
    "B905", # `zip()` without an explicit `strict=` parameter
    "E501", # line too long
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR2004", # Replace magic number with named constant
    "PLR0913", # Too many arguments
    "COM812", # Missing trailing comma
]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
]

[tool.coverage]
    [tool.coverage.run]
    source=["cyclops"]
    omit=["tests/*", "*__init__.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
