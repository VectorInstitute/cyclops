name: unit tests

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unit_tests.yml
      - '**.py'
      - '**.html'
      - '**.jinja'
      - '**.js'
      - uv.lock
      - pyproject.toml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/unit_tests.yml
      - '**.py'
      - '**.html'
      - '**.jinja'
      - '**.js'
      - uv.lock
      - pyproject.toml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Install dependencies, run unit tests and coverage report
        run: |
          uv sync --no-default-groups --group test --all-extras
          uv run pytest -m "not integration_test" --cov-report term --cov-report xml:./coverage.xml --cov=cyclops -n auto --dist loadscope
      - name: Upload coverage to Codecov
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: codecov/codecov-action@v4.0.0
          with: |
            token: ${{ secrets.CODECOV_TOKEN }}
            file: ./coverage.xml
            name: codecov-umbrella
            fail_ci_if_error: false
          attempt_limit: 5
          attempt_delay: 30000
